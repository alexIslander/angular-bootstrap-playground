<h2>Toast</h2>
<div class="container">
  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="p-3">
          <h4 class="card-title mb-0">Show toast</h4>
        </div>
        <div class="card-body border-top">
          <div class="button-group">
            <button
              (click)="showToast('default')"
              #defaultButton
              class="btn btn-primary"
            >
              Default me!
            </button>
            <button
              (click)="showToast('info')"
              #infoButton
              class="btn btn-info"
            >
              Info me!
            </button>
            <button
              (click)="showToast('success')"
              #successButton
              class="btn btn-success"
            >
              Success me!
            </button>
            <button
              (click)="showToast('warning')"
              #warningButton
              class="btn btn-warning"
            >
              Warning me!
            </button>
            <button
              (click)="showToast('error')"
              #errorButton
              class="btn btn-danger"
            >
              Error me!
            </button>
          </div>
          <div class="toast align-items-center border-0 bottom-left-toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
              <div class="toast-body">
                Hello, world! This is a toast message.
              </div>
              <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
