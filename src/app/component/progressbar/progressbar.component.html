<h2>Progressbar</h2>
<div class="container">
    <div class="row">
      <div class="col-12">
        <div class="card">
          <div class="p-3">
            <h4 class="card-title mb-0">Striped Progressbar</h4>
          </div>
          <div class="card-body border-top">
            <p>
              <div class="progress">
                <div class="progress-bar bg-success progress-bar-animated progress-bar-striped" role="progressbar" style="width: 2.5%;" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100"></div>
              </div>
            <p>
              <div class="progress">
                <div class="progress-bar bg-info progress-bar-animated progress-bar-striped" role="progressbar" style="width: 5%;" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100"></div>
              </div>
              <p>
              <div class="progress">
                <div class="progress-bar bg-warning progress-bar-animated progress-bar-striped" role="progressbar" style="width: 7.5%;" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100"></div>
              </div>
              <p>
              <div class="progress">
                <div class="progress-bar bg-danger progress-bar-animated progress-bar-striped" role="progressbar" style="width: 10%;" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100"></div>
              </div>
              <p>
              <div class="progress">
                <div class="progress-bar bg-primary progress-bar-animated progress-bar-striped" role="progressbar" style="width: 7.5%;" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100"></div>
              </div>
              <p>
              <div class="progress">
                <div class="progress-bar bg-secondary progress-bar-animated progress-bar-striped" role="progressbar" style="width: 5%;" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100"></div>
              </div>
              <p>
              <div class="progress">
                <div class="progress-bar bg-dark progress-bar-animated progress-bar-striped" role="progressbar" style="width: 2.5%;" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100"></div>
              </div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-12">
      <div class="card">
        <div class="p-3">
          <h4 class="card-title mb-0">Basic Progressbar</h4>
        </div>
        <div class="card-body border-top">
          <p>
            <div class="progress" role="progressbar" aria-label="Success example" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100">
              <div class="progress-bar bg-success" style="width: 25%">
                <span>25% Complete</span>
              </div>
            </div>
          <p>
            <div class="progress" role="progressbar" aria-label="Info example" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100">
              <div class="progress-bar bg-info" style="width: 50%"></div>
          </div>
          <p>
          <div class="progress" role="progressbar" aria-label="Warning example" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">
              <div class="progress-bar bg-warning" style="width: 75%"></div>
          </div>
          <p>
          <div class="progress" role="progressbar" aria-label="Danger example" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
              <div class="progress-bar bg-danger" style="width: 100%">
                <span>100%</span>
              </div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-12">
      <div class="card">
        <div class="p-3">
          <h4 class="card-title mb-0">Animated Progressbar</h4>
        </div>
        <div class="card-body border-top">
          <p>
            <div class="progress">
              <div class="progress-bar bg-{{ progressBar }} progress-bar-animated progress-bar-striped" role="progressbar" style="width: {{ progress }}%;" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100">
                <span>{{ progress }}%</span>
              </div>
            </div>
        </div>
      </div>
    </div>
  </div>
